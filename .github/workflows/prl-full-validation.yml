name: PRL Full Validation

# Manually run before regional milestones; not on every Kanto PR.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prl-full-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  regional-builds:
    name: ROM (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [firered, leafgreen, emerald]
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Restore original pinned forest intro artwork
        run: python3 tools/prl/prepare_hwl_scene0.py
      - name: Build regional ROM
        run: |
          case ${{ matrix.target }} in
            firered)  make firered -j$(nproc) -O ;;
            leafgreen) make leafgreen -j$(nproc) -O ;;
            emerald)   make -j$(nproc) -O all ;;
            *) exit 2 ;;
          esac

  full-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Python regressions
        run: python3 -m unittest discover -s tests -v
      - name: Restore original pinned forest intro artwork
        run: python3 tools/prl/prepare_hwl_scene0.py
      - name: Run full native engine tests (failure remains visible)
        env:
          GAME_VERSION: EMERALD
          TEST: 1
        run: |
          set +e
          make -j$(nproc) check > /tmp/prl-full-check.log 2>&1
          status=$?
          tail -n 100 /tmp/prl-full-check.log
          exit "$status"

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Restore original pinned forest intro artwork
        run: python3 tools/prl/prepare_hwl_scene0.py
      - name: Validate Emerald release target
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) release
