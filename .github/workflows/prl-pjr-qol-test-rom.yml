name: PRL Combined Eevee Twins and PJR PHR QoL FireRed ROM
on:
  push:
    branches: [prl/combined-eevee-qol-20261011]
    paths:
      - .github/workflows/prl-pjr-qol-test-rom.yml
      - tests/test_prl_recurring_duos.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      COMPARE: 0
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
    steps:
      - name: Checkout combined Eevee and QoL Kanto source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Confirm authentic Eeveelution sprite assets are present
        run: test -f graphics/pokemon/eeveeon/front.png && test -f graphics/pokemon/nimbeon/front.png
      - name: Validate Kanto Eevee Twins and new species
        run: python3 -m unittest tests.test_prl_recurring_duos tests.test_prl_eeveeon_nimbeon tests.test_prl_pjr_qol_dexnav tests.test_prl_pjr_qol_center_clocks tests.test_prl_pjr_registered_items
      - name: Install GBA ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Preserve donor Celebi and Jirachi opening assets
        run: python3 tools/prl/prepare_hwl_scene0.py
      - name: Compile combined FireRed ROM once
        shell: bash
        run: |
          set +e
          make firered -j$(nproc) -O > /tmp/prl-eevee-build.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            tail -n 35 /tmp/prl-eevee-build.log
          else
            grep -E -C 3 'error:|fatal|undefined reference|No rule to make target|make(\\[[0-9]+\\])?: \\*\\*\\*' /tmp/prl-eevee-build.log | tail -n 150 || tail -n 120 /tmp/prl-eevee-build.log
          fi
          exit "$status"
      - name: Upload FireRed playable ROM
        uses: actions/upload-artifact@v4
        with:
          name: PRL_Combined_Steevee_Neevee_Eeveeon_Nimbeon_QoL_20261011
          path: pokefirered.gba
          if-no-files-found: error
          retention-days: 2
