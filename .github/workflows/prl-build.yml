name: PRL Hosted Build

on:
  push:
    branches:
      - prl-main
      - prl/step10-mass-integration
      - prl/skulberus-phantowl-donor-20261008
  workflow_dispatch:

env:
  COMPARE: 0

jobs:
  build-prl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PRL canonical package
        run: python3 docs/prl-canonical/validate_canonical.py

      - name: Validate Skulberus mechanics regressions
        run: python3 -m unittest tests.test_skulberus_mechanics

      - name: Validate PRL Step 12 integration
        run: python3 -m unittest discover -s tests -p 'test_prl_step12_*.py'

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: prl-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build PRL FireRed target
        run: make firered -j$(nproc) -O

      - name: Upload PRL ROM
        uses: actions/upload-artifact@v4
        with:
          name: PRL-hosted-build
          path: |
            pokefirered.gba
            *.map
          if-no-files-found: error
