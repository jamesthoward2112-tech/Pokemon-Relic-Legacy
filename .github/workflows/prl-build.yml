name: PRL Hosted Build

on:
  push:
    branches:
      - prl-main
      - prl/step10-mass-integration
      - prl/skulberus-phantowl-donor-20261008
  workflow_dispatch:

env:
  COMPARE: 0

jobs:
  build-prl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PRL canonical package
        run: python3 docs/prl-canonical/validate_canonical.py

      - name: Validate Skulberus mechanics regressions
        run: python3 -m unittest tests.test_skulberus_mechanics

      - name: Validate PRL Step 12 integration
        run: python3 -m unittest discover -s tests -p 'test_prl_step12_*.py'

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: prl-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build PRL FireRed target
        run: make firered -j$(nproc) -O

      - name: Run PRL FireRed battle regressions
        if: ${{ !contains(github.event.head_commit.message, '[focused-redux-validation]') }}
        env:
          GAME_VERSION: FIRERED
          TEST: 1
        run: |
          chmod +x tools/mgba/mgba-rom-test
          make BUILD=firered -j$(nproc) check

      - name: Run focused Redux mechanics battle tests
        if: ${{ contains(github.event.head_commit.message, '[focused-redux-validation]') }}
        env:
          GAME_VERSION: FIRERED
          TEST: 1
        run: |
          chmod +x tools/mgba/mgba-rom-test
          failed=0
          for suite in \
            test/battle/ability/skulberus.c \
            test/battle/status1/bleed.c \
            test/battle/move_effect/rip_and_tear.c \
            test/battle/status1/frostbite.c \
            test/battle/move_effect/fear.c \
            test/battle/volatiles/confusion.c \
            test/battle/move_effect/attract.c \
            test/battle/weather/eerie_fog.c \
            test/battle/move_effect/weather_ball.c \
            test/battle/move_effect/curse.c \
            test/battle/move_effect/revival_blessing.c; do
            echo "Running focused battle suite: $suite"
            if ! make BUILD=firered -j$(nproc) check TESTS="$suite"; then
              failed=1
            fi
            rm -f pokefirered-test.elf pokefirered-test-headless.elf
          done
          exit "$failed"

      - name: Upload PRL ROM
        uses: actions/upload-artifact@v4
        with:
          name: PRL-hosted-build
          path: |
            pokefirered.gba
            *.map
          if-no-files-found: error
