name: CI

# Fast Kanto gate. Full cross-region validation is a separate manual workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prl-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build-firered:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Restore SHA-pinned original Celebi/Jirachi forest artwork
        run: python3 tools/prl/prepare_hwl_scene0.py

      - name: ROM (Firered)
        run: |
          log=/tmp/prl-firered.log
          set +e
          make firered -j$(nproc) -O > "$log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            tail -n 20 "$log"
          elif grep -E -C 3 'error:|fatal|undefined reference|No rule to make target|make(\[[0-9]+\])?: \*\*\*' "$log" > /tmp/prl-firered-errors.log; then
            tail -n 100 /tmp/prl-firered-errors.log
          else
            tail -n 100 "$log"
          fi
          exit "$status"

      - name: Upload FireRed test ROM
        uses: actions/upload-artifact@v4
        with:
          name: prl-kanto-test-rom
          path: pokefirered.gba
          if-no-files-found: error
          retention-days: 2

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python source and regression tests
        run: python3 -m unittest discover -s tests -v

  docs_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check SUMMARY.md links
        run: python3 .github/docs_validate/inclusive_summary.py

  # Preserve the required 'build' branch protection status.
  # A skipped or cancelled prerequisite must NEVER count as success.
  build:
    needs: [build-firered, python-tests, docs_validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful FireRed, regression tests and docs
        env:
          FIRERED_RESULT: ${{ needs.build-firered.result }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          DOCS_RESULT: ${{ needs.docs_validate.result }}
        run: |
          for result in "$FIRERED_RESULT" "$PYTHON_RESULT" "$DOCS_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::CI prerequisite did not succeed: $result"
              exit 1
            fi
          done
          echo 'FireRed ROM, Python regressions and docs all passed.'
