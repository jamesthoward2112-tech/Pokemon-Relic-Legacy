name: CI

on:
  push:
    branches:
      - master
      - upcoming
  pull_request:

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build-emerald:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Restore SHA-pinned original Celebi/Jirachi forest artwork
        run: python3 tools/prl/prepare_hwl_scene0.py

      - name: ROM (Emerald)
        env:
          GAME_VERSION: EMERALD
        run: |
          log=/tmp/prl-emerald.log
          set +e
          make -j$(nproc) -O all > "$log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            tail -n 20 "$log"
          elif grep -E -C 3 'error:|fatal|undefined reference|No rule to make target|make(\[[0-9]+\])?: \*\*\*' "$log" > /tmp/prl-emerald-errors.log; then
            tail -n 100 /tmp/prl-emerald-errors.log
          else
            tail -n 100 "$log"
          fi
          exit "$status"

  build-firered:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Restore SHA-pinned original Celebi/Jirachi forest artwork
        run: python3 tools/prl/prepare_hwl_scene0.py

      - name: ROM (Firered)
        run: |
          log=/tmp/prl-firered.log
          set +e
          make firered -j$(nproc) -O > "$log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            tail -n 20 "$log"
          elif grep -E -C 3 'error:|fatal|undefined reference|No rule to make target|make(\[[0-9]+\])?: \*\*\*' "$log" > /tmp/prl-firered-errors.log; then
            tail -n 100 /tmp/prl-firered-errors.log
          else
            tail -n 100 "$log"
          fi
          exit "$status"

      - name: Upload FireRed test ROM
        uses: actions/upload-artifact@v4
        with:
          name: prl-kanto-test-rom
          path: pokefirered.gba
          if-no-files-found: error
          retention-days: 7

  build-leafgreen:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Restore SHA-pinned original Celebi/Jirachi forest artwork
        run: python3 tools/prl/prepare_hwl_scene0.py

      - name: ROM (Leafgreen)
        run: |
          log=/tmp/prl-leafgreen.log
          set +e
          make leafgreen -j$(nproc) -O > "$log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            tail -n 20 "$log"
          elif grep -E -C 3 'error:|fatal|undefined reference|No rule to make target|make(\[[0-9]+\])?: \*\*\*' "$log" > /tmp/prl-leafgreen-errors.log; then
            tail -n 100 /tmp/prl-leafgreen-errors.log
          else
            tail -n 100 "$log"
          fi
          exit "$status"

  release:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Restore SHA-pinned original Celebi/Jirachi forest artwork
        run: python3 tools/prl/prepare_hwl_scene0.py

      - name: Release
        env:
          GAME_VERSION: EMERALD
        run: |
          log=/tmp/prl-release.log
          set +e
          make -j$(nproc) release > "$log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            tail -n 20 "$log"
          elif grep -E -C 3 'error:|fatal|undefined reference|No rule to make target|make(\[[0-9]+\])?: \*\*\*' "$log" > /tmp/prl-release-errors.log; then
            tail -n 100 /tmp/prl-release-errors.log
          else
            tail -n 100 "$log"
          fi
          exit "$status"

  test:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: tools-check-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Restore SHA-pinned original Celebi/Jirachi forest artwork
        run: python3 tools/prl/prepare_hwl_scene0.py

      - name: Test
        env:
          GAME_VERSION: EMERALD
          TEST: 1
        run: |
          log=/tmp/prl-check.log
          set +e
          make -j$(nproc) check > "$log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            tail -n 20 "$log"
          elif grep -E -C 3 'error:|fatal|undefined reference|No rule to make target|make(\[[0-9]+\])?: \*\*\*' "$log" > /tmp/prl-check-errors.log; then
            tail -n 100 /tmp/prl-check-errors.log
          else
            tail -n 100 "$log"
          fi
          exit "$status"

  # Gate job: satisfies the "build" branch protection rule.
  # Passes only when all parallel build/test jobs succeed.
  build:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    needs: [build-emerald, build-firered, build-leafgreen, release, test]
    steps:
      - name: All builds passed
        run: echo "All builds and tests passed."

  docs_validate:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that SUMMARY.md includes markdown doc files
        run: python3 .github/docs_validate/inclusive_summary.py

  allcontributors:
    if: github.actor == 'allcontributors[bot]'
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Automatically pass for allcontributors
        run: echo "CI automatically passes for allcontributors" && exit 0
