name: Labels

# Only check labels when a reviewer submits a review; ordinary pushes/PR
# synchronizations no longer create misleading 'skipped' notifications.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  label:
    if: ${{ github.event.review.state == 'approved' && github.actor != 'allcontributors[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check approved PR labels
        uses: mheap/github-action-required-labels@v5
        with:
          mode: minimum
          count: 1
          labels: |
            General
            General Merge
            category: ability
            category: battle-ai
            category: battle-mechanic
            category: battle-tests
            category: items
            category: move animation
            category: move effect
            category: overworld
            category: pokemon
            category: sprite-issue
            type: documentation
